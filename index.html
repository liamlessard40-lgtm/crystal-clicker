<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crystal Clicker Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #080612;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header-panel {
            width: 100%;
            background: #110d21;
            border-bottom: 2px solid #21193d;
            padding: 12px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        h1 {
            font-size: 28px;
            margin: 0;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
        }
        .sub-header {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cps {
            color: #9d8ec4;
        }
        .shards-display {
            color: #ff00aa;
            font-weight: bold;
        }
        .prestige-btn {
            background: linear-gradient(135deg, #ff0077 0%, #7000ff 100%);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 119, 0.4);
            transition: transform 0.1s ease;
        }
        .prestige-btn:hover {
            transform: scale(1.05);
        }
        .prestige-btn:disabled {
            background: #231e3d;
            color: #5c5280;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* Redesigned Clean Navigation Grid */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 6px;
            padding: 8px 12px;
            background: #0d0b18;
            width: 100%;
            max-width: 950px;
            border-bottom: 2px solid #21193d;
        }
        .tab-btn {
            background: #17122e;
            color: #9d8ec4;
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            background: #21193d;
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.4);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
            color: #0d0b18;
            border-color: #00f0ff;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 950px;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .nav-tabs {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .crystal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            gap: 24px;
            background: radial-gradient(circle at center, #151128 0%, #080612 80%);
            transition: background 0.5s ease;
        }
        
        /* Dynamic Environment Background Styles */
        .crystal-container.env-volcanic { background: radial-gradient(circle at center, #3d120c 0%, #080612 80%); }
        .crystal-container.env-space { background: radial-gradient(circle at center, #0a113d 0%, #080612 80%); }
        .crystal-container.env-forest { background: radial-gradient(circle at center, #0e331b 0%, #080612 80%); }

        .crystal {
            width: 140px;
            height: 170px;
            background: linear-gradient(135deg, #00ffff 0%, #7000ff 50%, #ff0077 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6));
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
            z-index: 2;
        }
        .crystal.ruby { background: linear-gradient(135deg, #ff3333 0%, #990000 50%, #550000 100%); filter: drop-shadow(0 0 25px rgba(255, 50, 50, 0.6)); }
        .crystal.sapphire { background: linear-gradient(135deg, #3366ff 0%, #000099 50%, #000044 100%); filter: drop-shadow(0 0 25px rgba(50, 100, 255, 0.6)); }
        .crystal.emerald { background: linear-gradient(135deg, #33ff66 0%, #009933 50%, #004411 100%); filter: drop-shadow(0 0 25px rgba(50, 255, 100, 0.6)); }
        .crystal.gold-theme { background: linear-gradient(135deg, #ffcc00 0%, #cc6600 50%, #663300 100%); filter: drop-shadow(0 0 25px rgba(255, 200, 0, 0.6)); }

        .crystal::after {
            content: '';
            position: absolute;
            top: 5%; left: 5%;
            width: 90%; height: 90%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.4) 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            pointer-events: none;
        }
        .crystal:active {
            transform: scale(0.92) rotate(3deg);
        }
        
        .meters-container {
            width: 80%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        .meter-label {
            font-size: 12px;
            color: #9d8ec4;
            display: flex;
            justify-content: space-between;
        }
        .meter-bar {
            width: 100%;
            height: 8px;
            background: #151128;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #ff0077);
            transition: width 0.1s linear;
        }
        .meter-fill.fever {
            background: linear-gradient(90deg, #ffea00, #ff0000);
        }

        .shrine-obj {
            position: absolute;
            width: 50px;
            height: 60px;
            background: linear-gradient(135deg, #ffea00 0%, #ff6600 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.8);
            filter: drop-shadow(0 0 18px rgba(255, 234, 0, 0.8));
            z-index: 6;
            animation: driftAcross 8s linear forwards;
        }
        @keyframes driftAcross {
            0% { transform: translate(-150px, 120px) scale(0.5); opacity: 0; }
            15% { opacity: 1; transform: translate(0, -60px) scale(1.1); }
            85% { opacity: 1; }
            100% { transform: translate(280px, 140px) scale(0.8); opacity: 0; }
        }

        .side-panel {
            width: 380px;
            background: #0d0b18;
            border-left: 2px solid #21193d;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .side-panel {
                width: 100%;
                max-height: 45vh;
                border-left: none;
                border-top: 2px solid #21193d;
            }
        }
        .panel-tab-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151128;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.04);
        }
        .shop-item button {
            background: #00f0ff;
            color: #0d0b18;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s ease;
        }
        .shop-item button:hover:not(:disabled) {
            transform: scale(1.05);
        }
        .shop-item button:disabled {
            background: #231e3d;
            color: #5c5280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .item-info div:first-child {
            font-weight: bold;
            font-size: 13px;
            color: #ff88dc;
        }
        .item-info div:last-child {
            font-size: 11px;
            color: #9d8ec4;
            margin-top: 3px;
        }

        /* Profile & Card Layouts */
        .profile-card {
            background: linear-gradient(135deg, #181330 0%, #110d21 100%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid #00f0ff;
        }
        .profile-titles {
            display: flex;
            flex-direction: column;
        }
        .profile-name { font-size: 16px; font-weight: bold; color: #fff; }
        .profile-rank { font-size: 11px; color: #ff00aa; font-weight: bold; }

        .card-item {
            display: flex;
            align-items: center;
            background: #151128;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 119, 0.2);
            gap: 12px;
        }
        .card-item.ready {
            border-color: rgba(255, 234, 0, 0.8);
            background: #1d1b11;
        }
        .card-item.completed {
            border-color: rgba(0, 255, 100, 0.5);
            background: #111a18;
            opacity: 0.8;
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #7000ff 0%, #00f0ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .card-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .card-title { font-weight: bold; font-size: 13px; color: #ffffff; }
        .card-desc { font-size: 11px; color: #9d8ec4; }
        .card-reward { font-size: 10px; color: #ffea00; font-weight: bold; }
        
        .claim-btn {
            background: #ffea00 !important;
            color: #0d0b18 !important;
            animation: pulseBtn 1s infinite alternate;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background: #151128;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            text-align: center;
        }
        .stat-val { font-size: 16px; font-weight: bold; color: #00f0ff; margin-top: 4px; }
        .stat-lbl { font-size: 11px; color: #9d8ec4; }

        .floating-text {
            position: absolute;
            color: #00f0ff;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            text-shadow: 0 0 8px #ff00ff;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
        }
        .floating-text.crit {
            color: #ffea00;
            font-size: 26px;
            text-shadow: 0 0 12px #ff0000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="header-panel">
        <h1 id="crystalCount">0 Crystals</h1>

    <!-- Clean, non-cramped navigation tab grid -->

    </div>

    <div class="main-layout">
        <div class="crystal-container" id="crystalContainer">
            <div class="crystal" id="crystalBtn"></div>
            
            <div class="meters-container">
                <div>
                    <div class="meter-label"><span>Fever Meter</span><span id="feverText">0%</span></div>
                    <div class="meter-bar"><div class="meter-fill fever" id="feverFill"></div></div>
                </div>
                <div>
                    <div class="meter-label"><span>Combo Bar</span><span id="comboText">0x</span></div>
                    <div class="meter-bar"><div class="meter-fill" id="comboFill"></div></div>
                </div>
            </div>
        </div>
        
        <div class="side-panel">

            <div id="clicksContent" class="panel-tab-content hidden"></div>
            <div id="profileContent" class="panel-tab-content hidden"></div>

            <div id="petsContent" class="panel-tab-content hidden"></div>
            <div id="ascendTreeContent" class="panel-tab-content hidden"></div>
            <div id="skinsContent" class="panel-tab-content hidden"></div>
            <div id="environmentsContent" class="panel-tab-content hidden"></div>
            <div id="statsContent" class="panel-tab-content hidden"></div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && ['I','J','C'].includes(event.key)) || (event.ctrlKey && event.key === 'U')) {
                event.preventDefault();
            }
        });

        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'buy') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'unlock') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let crystals = 0;
        let lifetimeCrystals = 0;
        let shards = 0;
        let prestigeCount = 0;
        let totalClicks = 0;
        let timePlayed = 0;
        let currentSkin = 'default';
        let currentEnvironment = 'default';
        
        let comboMeter = 0;
        let feverMeter = 0;
        let isFeverActive = false;
        let feverTimer = 0;
        let shrineActive = false;
        let shrineMultiplier = 1;

        const clickUpgrades = {
            click1: { name: "Sharpened Edge", cost: 75000, mult: 2, purchased: false },
            click2: { name: "Diamond Tip", cost: 850000, mult: 3, purchased: false },

                hash = (hash << 5) - hash + combined.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString(36);
        }

        const crystalBtn = document.getElementById('crystalBtn');

        function triggerClick(clientX, clientY) {
            totalClicks++;
            playSound('click');

            let clickMultiplier = 1;
            Object.keys(clickUpgrades).forEach(k => { if (clickUpgrades[k].purchased) clickMultiplier *= clickUpgrades[k].mult; });
            clickMultiplier *= (1 + ascendTree.node1.level * 0.1);
            
            let critChance = 0.05;
            if (currentEnvironment === 'volcanic') critChance = 0.10;

            const isCrit = Math.random() < critChance;
            let gain = (isCrit ? 5 : 1) * clickMultiplier * (shrineActive ? shrineMultiplier : 1);
            if (isFeverActive) gain *= 3;

            crystals += gain;
            lifetimeCrystals += gain;

            comboMeter = Math.min(100, comboMeter + 10);
            let feverSpeed = 2;
            if (artifacts.art3.level > 0) feverSpeed = 2.4;
            feverMeter = Math.min(100, feverMeter + feverSpeed);
            if (feverMeter >= 100 && !isFeverActive) {
                isFeverActive = true;
                feverTimer = 10 + (ascendTree.node3.level * 2);
            }

            createFloatingText(clientX, clientY, isCrit ? `+${formatNum(gain)} CRIT!` : `+${formatNum(gain)}`, isCrit);
            checkAchievements();
            updateUI();
        }

        crystalBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            triggerClick(e.clientX, e.clientY);

        function buyUpgrade(type) {
            const item = upgrades[type];
            if (crystals >= Number(item.cost)) {
                crystals -= Number(item.cost);
                item.qty++;
                let nextCost = item.baseCost;
                for (let i = 0; i < item.qty; i++) nextCost = (nextCost * 115n) / 100n;
                item.cost = nextCost;
                playSound('buy');
                checkAchievements();
                updateUI();
            }
        }

        function buyClickUpgrade(type) {
            const item = clickUpgrades[type];
            if (!item.purchased && crystals >= item.cost) {
                crystals -= item.cost;
                item.purchased = true;
                playSound('unlock');
                updateUI();
            }
        }

        function buyArtifact(type) {
            const art = artifacts[type];
            if (shards >= art.cost && art.level < art.max) {
                shards -= art.cost;
                art.level++;
                art.cost = Math.floor(art.cost * 1.5);
                playSound('unlock');
                updateUI();
            }
        }

        function buyPet(type) {
            const pet = pets[type];
            if (!pet.owned && shards >= pet.cost) {
                shards -= pet.cost;
                pet.owned = true;
                playSound('unlock');
                updateUI();
            }
        }

            const node = ascendTree[type];
            if (shards >= node.cost && node.level < node.max) {
                shards -= node.cost;
                node.level++;
                node.cost = Math.floor(node.cost * 1.8);
                playSound('unlock');
                updateUI();
            }
        }

        function getTotalPickaxes() {
            let total = 0;
            Object.keys(upgrades).forEach(k => total += upgrades[k].qty);
            return total;
        }

        function getCps() {
            let total = 0;
            Object.keys(upgrades).forEach(k => {
                let qty = upgrades[k].qty;
                let mult = 1;
                if (qty >= 100) mult = 4;
                else if (qty >= 50) mult = 2.5;
                else if (qty >= 25) mult = 1.5;
                total += qty * Number(upgrades[k].cps) * mult;
            });
            total *= (1 + artifacts.art2.level * 0.15);
            total *= (1 + ascendTree.node2.level * 0.15);
            if (currentEnvironment === 'space') total *= 1.10;
            if (pets.pet3.owned) total *= 1.25;
            if (shrineActive) total *= shrineMultiplier;
            return total;
        }

        function triggerPrestige() {
            if (crystals < 1000000) return;
            let shardMultiplier = 1 + artifacts.art1.level * 0.1;
            if (currentEnvironment === 'forest') shardMultiplier += 0.10;
            if (pets.pet2.owned) shardMultiplier += 0.1;
            const earnedShards = Math.floor(Math.sqrt(crystals / 1000000) * shardMultiplier);
            shards += earnedShards;
            prestigeCount++;
            crystals = 0;
            Object.keys(upgrades).forEach(k => { upgrades[k].qty = 0; upgrades[k].cost = upgrades[k].baseCost; });
            playSound('unlock');
            checkAchievements();
            updateUI();
        }

        function switchTab(tab) {
            ['shopContent', 'clicksContent', 'profileContent', 'achievementsContent', 'questsContent', 'artifactsContent', 'petsContent', 'ascendTreeContent', 'skinsContent', 'environmentsContent', 'statsContent'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Content').classList.remove('hidden');
        }

        function checkAchievements() {
            Object.keys(achievements).forEach(key => {
                const ach = achievements[key];
                if (ach.status === 0 && ach.check()) {
                    ach.status = 1;
                }
            });
            Object.keys(quests).forEach(key => {
                const q = quests[key];
                if (q.status === 0 && q.check()) {
                    q.status = 1;
                }
            });
        }

        function claimAchievement(key) {
            const ach = achievements[key];
            if (ach.status === 1) {
                ach.status = 2;
                ach.rewardGiven();
                playSound('unlock');
                updateUI();

        }

            const q = quests[key];
            if (q.status === 1) {
                q.status = 2;
                q.rewardGiven();
                playSound('unlock');
                updateUI();
            }
        }

        function formatNum(num) {
            let n = Number(num);
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'k';
            return Math.floor(n).toLocaleString();
        }

        function createFloatingText(x, y, textVal, isCrit = false) {
            const text = document.createElement('div');
            text.className = isCrit ? 'floating-text crit' : 'floating-text';
            text.innerText = textVal;
            const rect = crystalContainer.getBoundingClientRect();
            text.style.left = (x ? x : rect.left + rect.width / 2) + 'px';
            text.style.top = (y ? y : rect.top + rect.height / 2) + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        let petTimer = 0;
        setInterval(() => {
            if (pets.pet1.owned) {
                petTimer++;
                if (petTimer >= 30) {
                    petTimer = 0;
                    const rect = crystalContainer.getBoundingClientRect();
                    triggerClick(rect.left + rect.width / 2, rect.top + rect.height / 2);
                }
            }

            if (!shrineActive && Math.random() < 0.2) {
                shrineActive = true;
                shrineMultiplier = 2;
                const shrine = document.createElement('div');
                shrine.className = 'shrine-obj';
                shrine.style.top = Math.random() * 50 + 20 + '%';
                shrine.style.left = Math.random() * 50 + 20 + '%';
                shrine.onclick = () => {
                    crystals += getCps() * 30;
                    shrine.remove();
                };
                crystalContainer.appendChild(shrine);
                setTimeout(() => { if (shrine.parentElement) shrine.remove(); shrineActive = false; }, 6000);
            }
        }, 100);

            document.getElementById('comboText').innerText = comboMeter + '%';

                document.getElementById('statLifetime').innerText = formatNum(lifetimeCrystals);
                document.getElementById('statClicks').innerText = totalClicks;
                document.getElementById('statTime').innerText = timePlayed + 's';
                document.getElementById('statAscend').innerText = prestigeCount;
            }

            if (document.getElementById('profileAscend')) {
                document.getElementById('profileAscend').innerText = prestigeCount;
                document.getElementById('profileShards').innerText = shards;
                document.getElementById('profileEnv').innerText = environmentsShop[currentEnvironment].name;
                let rankTitle = "Novice Breaker";
                if (prestigeCount >= 5) rankTitle = "Veteran Excavator";
                if (prestigeCount >= 15) rankTitle = "Master Geologist";
                if (prestigeCount >= 30) rankTitle = "Transcendent Overlord";
                document.getElementById('profileRankTitle').innerText = rankTitle;
            }

            Object.keys(upgrades).forEach(k => {
                document.getElementById(k + 'Cost').innerText = "Cost: " + formatNum(upgrades[k].cost);
                document.getElementById(k + 'Qty').innerText = upgrades[k].qty;
                document.getElementById('buy' + k).disabled = crystals < Number(upgrades[k].cost);
            });

            Object.keys(clickUpgrades).forEach(k => {
                const btn = document.getElementById('buyClick_' + k);
                if (clickUpgrades[k].purchased) {
                    btn.innerText = "Owned";
                    btn.disabled = true;
                } else {
                    btn.disabled = crystals < clickUpgrades[k].cost;
                }
            });

            Object.keys(achievements).forEach(k => {
                const ach = achievements[k];
                const card = document.getElementById(`card_${k}`);
                const claimBtn = document.getElementById(`claim_${k}`);
                card.className = 'card-item';
                if (ach.status === 1) {
                    card.classList.add('ready');
                    claimBtn.style.display = 'block';
                    claimBtn.className = 'tab-btn claim-btn';
                    claimBtn.innerText = 'Claim';
                } else if (ach.status === 2) {
                    card.classList.add('completed');
                    claimBtn.style.display = 'block';
                    claimBtn.className = 'tab-btn';
                    claimBtn.innerText = 'Claimed';
                    claimBtn.disabled = true;
                } else {
                    claimBtn.style.display = 'none';
                }
            });

            Object.keys(quests).forEach(k => {
                const q = quests[k];
                const card = document.getElementById(`quest_${k}`);
                const claimBtn = document.getElementById(`claim_q_${k}`);
                card.className = 'card-item';
                if (q.status === 1) {
                    card.classList.add('ready');
                    claimBtn.style.display = 'block';
                    claimBtn.className = 'tab-btn claim-btn';
                    claimBtn.innerText = 'Claim';
                } else if (q.status === 2) {
                    card.classList.add('completed');
                    claimBtn.style.display = 'block';
                    claimBtn.className = 'tab-btn';
                    claimBtn.innerText = 'Claimed';
                    claimBtn.disabled = true;
                } else {
                    claimBtn.style.display = 'none';
                }
            });

            Object.keys(artifacts).forEach(k => {
                document.getElementById(k + 'Lvl').innerText = artifacts[k].level;
                document.getElementById(k + 'Cost').innerText = artifacts[k].cost;
            });

            Object.keys(pets).forEach(k => {
                const btn = document.getElementById(`petBtn_${k}`);
                if (pets[k].owned) {
                    btn.innerText = "Owned";
                    btn.disabled = true;
                } else {
                    btn.disabled = shards < pets[k].cost;
                }
            });

            Object.keys(ascendTree).forEach(k => {
                document.getElementById(k + 'Lvl').innerText = ascendTree[k].level;
                document.getElementById(k + 'Cost').innerText = ascendTree[k].cost;
            });

            Object.keys(skinsShop).forEach(skinKey => {
                const skin = skinsShop[skinKey];
                const btn = document.getElementById(`skinBtn_${skinKey}`);
                if (currentSkin === skinKey) {
                    btn.innerText = "Active";
                    btn.disabled = true;
                } else if (skin.owned) {
                    btn.innerText = "Select";
                    btn.disabled = false;
                } else {
                    btn.innerText = "Buy";
                    btn.disabled = crystals < skin.cost;
                }
            });

            Object.keys(environmentsShop).forEach(envKey => {
                const env = environmentsShop[envKey];
                const btn = document.getElementById(`envBtn_${envKey}`);
                if (currentEnvironment === envKey) {
                    btn.innerText = "Active";
                    btn.disabled = true;
                } else if (env.owned) {
                    btn.innerText = "Select";
                    btn.disabled = false;
                } else {
                    btn.innerText = "Buy";
                    btn.disabled = crystals < env.cost;
                }
            });
        }

        setInterval(() => {
            crystals += getCps() / 10;
            lifetimeCrystals += getCps() / 10;
            timePlayed++;

            if (comboMeter > 0) comboMeter = Math.max(0, comboMeter - 2);
            if (isFeverActive) {
                feverTimer -= 0.1;
                if (feverTimer <= 0) { isFeverActive = false; feverMeter = 0; }
            }

            checkAchievements();
            updateUI();
        }, 100);

        setInterval(() => {
            const saveObj = {
                data: {
                    crystals, lifetimeCrystals, shards, prestigeCount, totalClicks, timePlayed, currentSkin, currentEnvironment,
                    upgrades: Object.fromEntries(Object.keys(upgrades).map(k => [k, { qty: upgrades[k].qty, cost: upgrades[k].cost.toString() }])),
                    clickUpgrades: Object.fromEntries(Object.keys(clickUpgrades).map(k => [k, clickUpgrades[k].purchased])),
                    artifacts: Object.fromEntries(Object.keys(artifacts).map(k => [k, artifacts[k].level])),
                    pets: Object.fromEntries(Object.keys(pets).map(k => [k, pets[k].owned])),
                    ascendTree: Object.fromEntries(Object.keys(ascendTree).map(k => [k, ascendTree[k].level])),
                    skinsShop: Object.fromEntries(Object.keys(skinsShop).map(k => [k, skinsShop[k].owned])),
                    environmentsShop: Object.fromEntries(Object.keys(environmentsShop).map(k => [k, environmentsShop[k].owned])),
                    achievements: Object.fromEntries(Object.keys(achievements).map(k => [k, achievements[k].status])),
                    quests: Object.fromEntries(Object.keys(quests).map(k => [k, quests[k].status])),
                    lastTimestamp: Date.now()
                }
            };
            saveObj.signature = generateSignature(JSON.stringify(saveObj.data));
            localStorage.setItem('crystalClickerUltimateSave', JSON.stringify(saveObj));
        }, 10000);

        updateUI();
    </script>
</body>
</html>
