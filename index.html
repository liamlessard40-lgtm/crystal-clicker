<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crystal Clicker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #080612;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header-panel {
            width: 100%;
            background: #110d21;
            border-bottom: 2px solid #21193d;
            padding: 12px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        h1 {
            font-size: 28px;
            margin: 0;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
        }
        .sub-header {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cps {
            color: #9d8ec4;
        }
        .prestige-btn {
            background: linear-gradient(135deg, #ff0077 0%, #7000ff 100%);
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 119, 0.4);
            display: inline-block;
        }
        .prestige-btn:disabled {
            background: #231e3d;
            color: #5c5280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .tab-btn {
            background: #21193d;
            color: #9d8ec4;
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #00f0ff;
            color: #0d0b18;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
        }
        .crystal-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .crystal {
            width: 130px;
            height: 160px;
            background: linear-gradient(135deg, #00ffff 0%, #7000ff 50%, #ff0077 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6));
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
            z-index: 2;
        }
        .crystal::after {
            content: '';
            position: absolute;
            top: 5%; left: 5%;
            width: 90%; height: 90%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.4) 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            pointer-events: none;
        }
        .crystal::before {
            content: '';
            position: absolute;
            top: 10%; left: 10%;
            width: 80%; height: 80%;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(0,0,0,0.3) 100%);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            z-index: 1;
            pointer-events: none;
        }
        .crystal:active {
            transform: scale(0.92) rotate(3deg);
        }
        .bonus-crystal {
            position: absolute;
            width: 55px;
            height: 70px;
            background: linear-gradient(135deg, #777777 0%, #222222 50%, #000000 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.6);
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.5));
            z-index: 5;
            animation: driftAcross 8s linear forwards;
        }
        .bonus-crystal::after {
            content: '';
            position: absolute;
            top: 5%; left: 5%;
            width: 90%; height: 90%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.6) 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            pointer-events: none;
        }
        @keyframes driftAcross {
            0% { transform: translate(-150px, 120px) scale(0.5); opacity: 0; }
            15% { opacity: 1; transform: translate(0, -60px) scale(1.1); }
            85% { opacity: 1; }
            100% { transform: translate(280px, 140px) scale(0.8); opacity: 0; }
        }

        .side-panel {
            width: 360px;
            background: #0d0b18;
            border-left: 2px solid #21193d;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .side-panel {
                width: 100%;
                max-height: 45vh;
                border-left: none;
                border-top: 2px solid #21193d;
            }
        }
        .panel-tab-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hidden {
            display: none !important;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151128;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.04);
            transition: border-color 0.2s ease;
        }
        .shop-item:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }
        .shop-item button {
            background: #00f0ff;
            color: #0d0b18;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .shop-item button:hover:not(:disabled) {
            transform: scale(1.03);
            filter: brightness(1.1);
        }
        .shop-item button:active:not(:disabled) {
            transform: scale(0.97);
        }
        .shop-item button:disabled {
            background: #231e3d;
            color: #5c5280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .item-info div:first-child {
            font-weight: bold;
            font-size: 14px;
            color: #ff88dc;
        }
        .item-info div:last-child {
            font-size: 11px;
            color: #9d8ec4;
            margin-top: 2px;
        }

        /* Achievement list styling with image on left */
        .achievement-card {
            display: flex;
            align-items: center;
            background: #151128;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 119, 0.2);
            gap: 12px;
            transition: border-color 0.2s;
        }
        .achievement-card.completed {
            border-color: rgba(0, 255, 100, 0.5);
            background: #111a18;
        }
        .achievement-img {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            background: linear-gradient(135deg, #7000ff 0%, #00f0ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .achievement-card.completed .achievement-img {
            background: linear-gradient(135deg, #00ff88 0%, #0088ff 100%);
        }
        .achievement-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .achievement-title {
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
        }
        .achievement-desc {
            font-size: 11px;
            color: #9d8ec4;
        }
        .achievement-reward {
            font-size: 10px;
            color: #ffea00;
            font-weight: bold;
        }

        .floating-text {
            position: absolute;
            color: #00f0ff;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            text-shadow: 0 0 8px #ff00ff;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
        }
        .floating-text.crit {
            color: #ffea00;
            font-size: 28px;
            text-shadow: 0 0 12px #ff0000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="header-panel">
        <h1 id="crystalCount">0 Crystals</h1>
        <div class="sub-header">
            <div class="cps" id="cpsCount">per second: 0</div>
            <button class="prestige-btn" id="prestigeBtn" onclick="triggerPrestige()">Prestige (Req: 1M)</button>
            <button class="tab-btn active" id="shopTabBtn" onclick="switchTab('shop')">Shop</button>
            <button class="tab-btn" id="achievementsTabBtn" onclick="switchTab('achievements')">Achievements</button>
        </div>
    </div>
    
    <div class="main-layout">
        <div class="crystal-container" id="crystalContainer">
            <div class="crystal" id="crystalBtn"></div>
        </div>
        
        <div class="side-panel">
            <!-- Shop Tab Content -->
            <div id="shopContent" class="panel-tab-content">
                <!-- Dynamically populated shop items -->
            </div>

            <!-- Achievements Tab Content -->
            <div id="achievementsContent" class="panel-tab-content hidden">
                <!-- Dynamically populated achievements list -->
            </div>
        </div>
    </div>

    <script>
        // Disable casual right-click and common dev shortcuts
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' ||
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) ||
                (event.ctrlKey && event.key === 'U')
            ) {
                event.preventDefault();
            }
        });

        let crystals = 0;
        let prestigeCount = 0;
        
        const upgrades = {
            pickaxe1:  { name: "Copper Pickaxe", qty: 0, cost: 15, baseCost: 15, cps: 0.2 },
            pickaxe2:  { name: "Tin Pickaxe", qty: 0, cost: 100, baseCost: 100, cps: 1.2 },
            pickaxe3:  { name: "Bronze Pickaxe", qty: 0, cost: 850, baseCost: 850, cps: 8 },
            pickaxe4:  { name: "Iron Pickaxe", qty: 0, cost: 5200, baseCost: 5200, cps: 45 },
            pickaxe5:  { name: "Steel Pickaxe", qty: 0, cost: 32000, baseCost: 32000, cps: 260 },
            pickaxe6:  { name: "Silver Pickaxe", qty: 0, cost: 190000, baseCost: 190000, cps: 1400 },
            pickaxe7:  { name: "Gold Pickaxe", qty: 0, cost: 1100000, baseCost: 1100000, cps: 7800 },
            pickaxe8:  { name: "Platinum Pickaxe", qty: 0, cost: 6500000, baseCost: 6500000, cps: 44000 },
            pickaxe9:  { name: "Titanium Pickaxe", qty: 0, cost: 38000000, baseCost: 38000000, cps: 260000 },
            pickaxe10: { name: "Quantum Pickaxe", qty: 0, cost: 220000000, baseCost: 220000000, cps: 1500000 },
            pickaxe11: { name: "Plasma Pickaxe", qty: 0, cost: 1300000000, baseCost: 1300000000, cps: 9000000 },
            pickaxe12: { name: "Void Pickaxe", qty: 0, cost: 7500000000, baseCost: 7500000000, cps: 52000000 },
            pickaxe13: { name: "Nebula Pickaxe", qty: 0, cost: 44000000000, baseCost: 44000000000, cps: 310000000 },
            pickaxe14: { name: "Supernova Pickaxe", qty: 0, cost: 260000000000, baseCost: 260000000000, cps: 1800000000 },
            pickaxe15: { name: "Singularity Pickaxe", qty: 0, cost: 1500000000000, baseCost: 1500000000000, cps: 11000000000 },
            pickaxe16: { name: "Dark Matter Pickaxe", qty: 0, cost: 9000000000000, baseCost: 9000000000000, cps: 65000000000 },
            pickaxe17: { name: "Antimatter Pickaxe", qty: 0, cost: 54000000000000, baseCost: 54000000000000, cps: 390000000000 },
            pickaxe18: { name: "Aether Pickaxe", qty: 0, cost: 320000000000000, baseCost: 320000000000000, cps: 2300000000000 },
            pickaxe19: { name: "Chronos Pickaxe", qty: 0, cost: 1900000000000000, baseCost: 1900000000000000, cps: 14000000000000 },
            pickaxe20: { name: "Cosmic Pickaxe", qty: 0, cost: 11500000000000000, baseCost: 11500000000000000, cps: 85000000000000 },
            pickaxe21: { name: "Dimension Pickaxe", qty: 0, cost: 70000000000000000, baseCost: 70000000000000000, cps: 520000000000000 },
            pickaxe22: { name: "Infinity Pickaxe", qty: 0, cost: 420000000000000000, baseCost: 420000000000000000, cps: 3200000000000000 },
            pickaxe23: { name: "Eternity Pickaxe", qty: 0, cost: 2600000000000000000, baseCost: 2600000000000000000, cps: 20000000000000000 },
            pickaxe24: { name: "Godhood Pickaxe", qty: 0, cost: 16000000000000000000, baseCost: 16000000000000000000, cps: 125000000000000000 },
            pickaxe25: { name: "Omni Pickaxe", qty: 0, cost: 100000000000000000000, baseCost: 100000000000000000000, cps: 800000000000000000 },
            // 15 New Pickaxes
            pickaxe26: { name: "Nexus Pickaxe", qty: 0, cost: 650000000000000000000n, baseCost: 650000000000000000000n, cps: 5000000000000000000n },
            pickaxe27: { name: "Stellar Pickaxe", qty: 0, cost: 4000000000000000000000n, baseCost: 4000000000000000000000n, cps: 32000000000000000000n },
            pickaxe28: { name: "Pulsar Pickaxe", qty: 0, cost: 25000000000000000000000n, baseCost: 25000000000000000000000n, cps: 200000000000000000000n },
            pickaxe29: { name: "Quasar Pickaxe", qty: 0, cost: 160000000000000000000000n, baseCost: 160000000000000000000000n, cps: 1300000000000000000000n },
            pickaxe30: { name: "Event Horizon Pickaxe", qty: 0, cost: 1000000000000000000000000n, baseCost: 1000000000000000000000000n, cps: 8500000000000000000000n },
            pickaxe31: { name: "Abyssal Pickaxe", qty: 0, cost: 7000000000000000000000000n, baseCost: 7000000000000000000000000n, cps: 55000000000000000000000n },
            pickaxe32: { name: "Genesis Pickaxe", qty: 0, cost: 45000000000000000000000000n, baseCost: 45000000000000000000000000n, cps: 360000000000000000000000n },
            pickaxe33: { name: "Elysian Pickaxe", qty: 0, cost: 300000000000000000000000000n, baseCost: 300000000000000000000000000n, cps: 2400000000000000000000000n },
            pickaxe34: { name: "Zenith Pickaxe", qty: 0, cost: 2000000000000000000000000000n, baseCost: 2000000000000000000000000000n, cps: 16000000000000000000000000n },
            pickaxe35: { name: "Apex Pickaxe", qty: 0, cost: 14000000000000000000000000000n, baseCost: 14000000000000000000000000000n, cps: 110000000000000000000000000n },
            pickaxe36: { name: "Nirvana Pickaxe", qty: 0, cost: 95000000000000000000000000000n, baseCost: 95000000000000000000000000000n, cps: 750000000000000000000000000n },
            pickaxe37: { name: "Multiverse Pickaxe", qty: 0, cost: 650000000000000000000000000000n, baseCost: 650000000000000000000000000000n, cps: 5000000000000000000000000000n },
            pickaxe38: { name: "Hyperverse Pickaxe", qty: 0, cost: 4500000000000000000000000000000n, baseCost: 4500000000000000000000000000000n, cps: 35000000000000000000000000000n },
            pickaxe39: { name: "Alpha & Omega Pickaxe", qty: 0, cost: 32000000000000000000000000000000n, baseCost: 32000000000000000000000000000000n, cps: 250000000000000000000000000000n },
            pickaxe40: { name: "Absolute Pickaxe", qty: 0, cost: 250000000000000000000000000000000n, baseCost: 250000000000000000000000000000000n, cps: 2000000000000000000000000000000n }
        };

        // Achievements list
        const achievements = {
            ach1: { title: "First Spark", desc: "Reach 100 crystals", reward: "500 Crystals", icon: "💎", completed: false, check: () => crystals >= 100, rewardGiven: () => crystals += 500 },
            ach2: { title: "Heavy Hitter", desc: "Reach 10,000 crystals", reward: "5,000 Crystals", icon: "⛏️", completed: false, check: () => crystals >= 10000, rewardGiven: () => crystals += 5000 },
            ach3: { title: "Crystal Millionaire", desc: "Reach 1,000,000 crystals", reward: "1 Prestige Level", icon: "✨", completed: false, check: () => crystals >= 1000000, rewardGiven: () => prestigeCount++ },
            ach4: { title: "Tool Up", desc: "Buy 10 total pickaxes", reward: "10,000 Crystals", icon: "🔧", completed: false, check: () => getTotalPickaxes() >= 10, rewardGiven: () => crystals += 10000 },
            ach5: { title: "Industrial Mining", desc: "Buy 50 total pickaxes", reward: "100,000 Crystals", icon: "🏭", completed: false, check: () => getTotalPickaxes() >= 50, rewardGiven: () => crystals += 100000 },
            ach6: { title: "First Resonance", desc: "Perform your first Prestige", reward: "1,000 Crystals", icon: "🌌", completed: false, check: () => prestigeCount >= 1, rewardGiven: () => crystals += 1000 }
        };

        const SECRET_SALT = "MySuperSecretCrystalKey123!";

        function generateSignature(dataText) {
            let hash = 0;
            const combined = dataText + SECRET_SALT;
            for (let i = 0; i < combined.length; i++) {
                hash = (hash << 5) - hash + combined.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString(36);
        }

        // Build shop UI dynamically
        const shopPanel = document.getElementById('shopContent');
        Object.keys(upgrades).forEach(key => {
            const item = upgrades[key];
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="item-info">
                    <div>${item.name}</div>
                    <div id="${key}Cost">Cost: ${formatNum(item.cost)}</div>
                </div>
                <button id="buy${key.charAt(0).toUpperCase() + key.slice(1)}" onclick="buyUpgrade('${key}')">Buy (<span id="${key}Qty">0</span>)</button>
            `;
            shopPanel.appendChild(div);
        });

        // Build achievements UI list dynamically
        const achPanel = document.getElementById('achievementsContent');
        Object.keys(achievements).forEach(key => {
            const ach = achievements[key];
            const div = document.createElement('div');
            div.className = 'achievement-card';
            div.id = `card_${key}`;
            div.innerHTML = `
                <div class="achievement-img" id="icon_${key}">${ach.icon}</div>
                <div class="achievement-details">
                    <div class="achievement-title">${ach.title}</div>
                    <div class="achievement-desc">${ach.desc}</div>
                    <div class="achievement-reward">Reward: ${ach.reward}</div>
                </div>
            `;
            achPanel.appendChild(div);
        });

        if (localStorage.getItem('crystalClickerSave')) {
            try {
                const savedEnvelope = JSON.parse(localStorage.getItem('crystalClickerSave'));
                const expectedSignature = generateSignature(JSON.stringify(savedEnvelope.data));
                if (savedEnvelope.signature === expectedSignature) {
                    const data = savedEnvelope.data;
                    crystals = Number(data.crystals || 0);
                    prestigeCount = data.prestigeCount || 0;
                    Object.keys(upgrades).forEach(key => {
                        if (data.upgrades && data.upgrades[key]) {
                            upgrades[key].qty = data.upgrades[key].qty;
                            upgrades[key].cost = BigInt(data.upgrades[key].cost);
                        }
                    });
                    if (data.achievements) {
                        Object.keys(data.achievements).forEach(key => {
                            if (achievements[key]) achievements[key].completed = data.achievements[key];
                        });
                    }
                } else {
                    alert("Cheating detected! Your save data has been reset.");
                    localStorage.removeItem('crystalClickerSave');
                }
            } catch (e) {
                console.error("Failed to load save file safely.");
            }
        }

        const crystalBtn = document.getElementById('crystalBtn');
        const crystalContainer = document.getElementById('crystalContainer');

        crystalBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const isCrit = Math.random() < 0.01;
            const mult = prestigeCount > 0 ? (1.5 + (prestigeCount - 1) * 0.5) : 1;
            const clickPower = (isCrit ? 5 : 1) * mult;
            crystals += clickPower;
            createFloatingText(e.clientX, e.clientY, isCrit ? `+${clickPower.toFixed(1)} CRIT!` : `+${mult.toFixed(1)}`, isCrit);
            checkAchievements();
            updateUI();
        });

        function buyUpgrade(type) {
            const item = upgrades[type];
            if (crystals >= Number(item.cost)) {
                crystals -= Number(item.cost);
                item.qty++;
                let nextCost = item.baseCost;
                for(let i=0; i<item.qty; i++) {
                    nextCost = (nextCost * 115n) / 100n;
                }
                item.cost = nextCost;
                checkAchievements();
                updateUI();
            }
        }

        function getTotalPickaxes() {
            let total = 0;
            Object.keys(upgrades).forEach(key => total += upgrades[key].qty);
            return total;
        }

        function getCps() {
            let totalCps = 0;
            Object.keys(upgrades).forEach(key => {
                totalCps += upgrades[key].qty * Number(upgrades[key].cps);
            });
            const mult = prestigeCount > 0 ? (1.5 + (prestigeCount - 1) * 0.5) : 1;
            return totalCps * mult;
        }

        function triggerPrestige() {
            if (crystals < 1000000) return;
            prestigeCount++;
            crystals = prestigeCount * 100;
            Object.keys(upgrades).forEach(key => {
                upgrades[key].qty = 0;
                upgrades[key].cost = upgrades[key].baseCost;
            });
            checkAchievements();
            updateUI();
        }

        function switchTab(tab) {
            const shopBtn = document.getElementById('shopTabBtn');
            const achBtn = document.getElementById('achievementsTabBtn');
            const shopCont = document.getElementById('shopContent');
            const achCont = document.getElementById('achievementsContent');

            if (tab === 'shop') {
                shopBtn.classList.add('active');
                achBtn.classList.remove('active');
                shopCont.classList.remove('hidden');
                achCont.classList.add('hidden');
            } else {
                achBtn.classList.add('active');
                shopBtn.classList.remove('active');
                achCont.classList.remove('hidden');
                shopCont.classList.add('hidden');
            }
        }

        function checkAchievements() {
            Object.keys(achievements).forEach(key => {
                const ach = achievements[key];
                if (!ach.completed && ach.check()) {
                    ach.completed = true;
                    ach.rewardGiven();
                    const card = document.getElementById(`card_${key}`);
                    if (card) card.classList.add('completed');
                }
            });
        }

        function formatNum(num) {
            let n = Number(num);
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'k';
            return Math.floor(n).toLocaleString();
        }

        function createFloatingText(x, y, textVal, isCrit = false) {
            const text = document.createElement('div');
            text.className = isCrit ? 'floating-text crit' : 'floating-text';
            text.innerText = textVal;
            const rect = crystalContainer.getBoundingClientRect();
            text.style.left = (x ? x : rect.left + rect.width / 2) + 'px';
            text.style.top = (y ? y : rect.top + rect.height / 2) + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function spawnBonusCrystal() {
            const bonus = document.createElement('div');
            bonus.className = 'bonus-crystal';
            bonus.style.top = Math.random() * 60 + 20 + '%';
            bonus.style.left = Math.random() * 60 + 20 + '%';
            
            bonus.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                const reward = Math.max(50, Math.floor(getCps() * 15));
                crystals += reward;
                createFloatingText(e.clientX, e.clientY, `+${reward} BONUS!`, true);
                checkAchievements();
                bonus.remove();
                updateUI();
            });

            crystalContainer.appendChild(bonus);
            setTimeout(() => {
                if (bonus.parentElement) bonus.remove();
            }, 8000);
        }

        setInterval(() => {
            if (Math.random() < 0.25) {
                spawnBonusCrystal();
            }
        }, 10000);

        function updateUI() {
            document.getElementById('crystalCount').innerText = formatNum(crystals) + " Crystals";
            document.getElementById('cpsCount').innerText = "per second: " + formatNum(getCps());
            
            const prestigeBtn = document.getElementById('prestigeBtn');
            prestigeBtn.disabled = crystals < 1000000;
            const nextMult = prestigeCount === 0 ? 1.5 : (1.5 + prestigeCount * 0.5);
            const nextBonus = (prestigeCount + 1) * 100;
            prestigeBtn.innerText = `Prestige (${nextMult}x, +${nextBonus} start)`;

            Object.keys(upgrades).forEach(key => {
                document.getElementById(key + 'Cost').innerText = "Cost: " + formatNum(upgrades[key].cost);
                document.getElementById(key + 'Qty').innerText = upgrades[key].qty;
                const btn = document.getElementById('buy' + key.charAt(0).toUpperCase() + key.slice(1));
                if (btn) btn.disabled = crystals < Number(upgrades[key].cost);
            });

            // Update achievement cards visual statuses
            Object.keys(achievements).forEach(key => {
                const ach = achievements[key];
                const card = document.getElementById(`card_${key}`);
                if (card && ach.completed) {
                    card.classList.add('completed');
                }
            });
        }

        setInterval(() => {
            crystals += getCps() / 10;
            checkAchievements();
            updateUI();
        }, 100);

        setInterval(() => {
            const rawUpgrades = {};
            Object.keys(upgrades).forEach(k => {
                rawUpgrades[k] = { qty: upgrades[k].qty, cost: upgrades[k].cost.toString() };
            });
            const rawAchievements = {};
            Object.keys(achievements).forEach(k => {
                rawAchievements[k] = achievements[k].completed;
            });
            const rawData = { crystals: crystals, prestigeCount: prestigeCount, upgrades: rawUpgrades, achievements: rawAchievements };
            const dataString = JSON.stringify(rawData);
            const secureEnvelope = {
                data: rawData,
                signature: generateSignature(dataString)
            };
            localStorage.setItem('crystalClickerSave', JSON.stringify(secureEnvelope));
        }, 10000);

        updateUI();
    </script>
</body>
</html>
