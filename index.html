<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crystal Clicker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #080612;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header-panel {
            width: 100%;
            background: #110d21;
            border-bottom: 2px solid #21193d;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        h1 {
            font-size: 30px;
            margin: 0 0 4px 0;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
        }
        .cps {
            font-size: 14px;
            color: #9d8ec4;
            letter-spacing: 0.5px;
        }
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
        }
        .crystal-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .crystal {
            width: 130px;
            height: 160px;
            background: linear-gradient(135deg, #00ffff 0%, #7000ff 50%, #ff0077 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6));
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
        }
        .crystal::after {
            content: '';
            position: absolute;
            top: 5%; left: 5%;
            width: 90%; height: 90%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.4) 100%);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            pointer-events: none;
        }
        .crystal::before {
            content: '';
            position: absolute;
            top: 10%; left: 10%;
            width: 80%; height: 80%;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(0,0,0,0.3) 100%);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            z-index: 1;
            pointer-events: none;
        }
        .crystal:active {
            transform: scale(0.92) rotate(3deg);
        }
        .shop-panel {
            width: 360px;
            background: #0d0b18;
            border-left: 2px solid #21193d;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .shop-panel {
                width: 100%;
                max-height: 45vh;
                border-left: none;
                border-top: 2px solid #21193d;
            }
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151128;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.04);
            transition: border-color 0.2s ease;
        }
        .shop-item:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }
        .shop-item button {
            background: #00f0ff;
            color: #0d0b18;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .shop-item button:hover:not(:disabled) {
            transform: scale(1.03);
            filter: brightness(1.1);
        }
        .shop-item button:active:not(:disabled) {
            transform: scale(0.97);
        }
        .shop-item button:disabled {
            background: #231e3d;
            color: #5c5280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .item-info div:first-child {
            font-weight: bold;
            font-size: 14px;
            color: #ff88dc;
        }
        .item-info div:last-child {
            font-size: 11px;
            color: #9d8ec4;
            margin-top: 2px;
        }
        .floating-text {
            position: absolute;
            color: #00f0ff;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            text-shadow: 0 0 8px #ff00ff;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="header-panel">
        <h1 id="crystalCount">0 Crystals</h1>
        <div class="cps" id="cpsCount">per second: 0</div>
    </div>
    
    <div class="main-layout">
        <div class="crystal-container" id="crystalContainer">
            <div class="crystal" id="crystalBtn"></div>
        </div>
        
        <div class="shop-panel" id="shopPanel">
            <!-- Dynamically populated shop items for 10 tiers -->
        </div>
    </div>

    <script>
        let crystals = 0;
        
        const upgrades = {
            pickaxe1:  { name: "Copper Pickaxe", qty: 0, cost: 15, baseCost: 15, cps: 0.2 },
            pickaxe2:  { name: "Tin Pickaxe", qty: 0, cost: 100, baseCost: 100, cps: 1.2 },
            pickaxe3:  { name: "Bronze Pickaxe", qty: 0, cost: 850, baseCost: 850, cps: 8 },
            pickaxe4:  { name: "Iron Pickaxe", qty: 0, cost: 5200, baseCost: 5200, cps: 45 },
            pickaxe5:  { name: "Steel Pickaxe", qty: 0, cost: 32000, baseCost: 32000, cps: 260 },
            pickaxe6:  { name: "Silver Pickaxe", qty: 0, cost: 190000, baseCost: 190000, cps: 1400 },
            pickaxe7:  { name: "Gold Pickaxe", qty: 0, cost: 1100000, baseCost: 1100000, cps: 7800 },
            pickaxe8:  { name: "Platinum Pickaxe", qty: 0, cost: 6500000, baseCost: 6500000, cps: 44000 },
            pickaxe9:  { name: "Titanium Pickaxe", qty: 0, cost: 38000000, baseCost: 38000000, cps: 260000 },
            pickaxe10: { name: "Quantum Pickaxe", qty: 0, cost: 220000000, baseCost: 220000000, cps: 1500000 }
        };

        const SECRET_SALT = "MySuperSecretCrystalKey123!";

        function generateSignature(dataText) {
            let hash = 0;
            const combined = dataText + SECRET_SALT;
            for (let i = 0; i < combined.length; i++) {
                hash = (hash << 5) - hash + combined.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString(36);
        }

        // Build shop UI dynamically for 10 items
        const shopPanel = document.getElementById('shopPanel');
        Object.keys(upgrades).forEach(key => {
            const item = upgrades[key];
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="item-info">
                    <div>${item.name}</div>
                    <div id="${key}Cost">Cost: ${item.cost}</div>
                </div>
                <button id="buy${key.charAt(0).toUpperCase() + key.slice(1)}" onclick="buyUpgrade('${key}')">Buy (<span id="${key}Qty">0</span>)</button>
            `;
            shopPanel.appendChild(div);
        });

        if (localStorage.getItem('crystalClickerSave')) {
            try {
                const savedEnvelope = JSON.parse(localStorage.getItem('crystalClickerSave'));
                const expectedSignature = generateSignature(JSON.stringify(savedEnvelope.data));
                if (savedEnvelope.signature === expectedSignature) {
                    const data = savedEnvelope.data;
                    crystals = data.crystals || 0;
                    Object.keys(upgrades).forEach(key => {
                        if (data.upgrades && data.upgrades[key]) {
                            upgrades[key].qty = data.upgrades[key].qty;
                            upgrades[key].cost = data.upgrades[key].cost;
                        }
                    });
                } else {
                    alert("Cheating detected! Your save data has been reset.");
                    localStorage.removeItem('crystalClickerSave');
                }
            } catch (e) {
                console.error("Failed to load save file safely.");
            }
        }

        const crystalBtn = document.getElementById('crystalBtn');
        const crystalContainer = document.getElementById('crystalContainer');

        crystalBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            crystals += 1;
            createFloatingText(e.clientX, e.clientY);
            updateUI();
        });

        function buyUpgrade(type) {
            const item = upgrades[type];
            if (crystals >= item.cost) {
                crystals -= item.cost;
                item.qty++;
                item.cost = Math.floor(item.baseCost * Math.pow(1.15, item.qty));
                updateUI();
            }
        }

        function getCps() {
            let totalCps = 0;
            Object.keys(upgrades).forEach(key => {
                totalCps += upgrades[key].qty * upgrades[key].cps;
            });
            return totalCps;
        }

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+1';
            const rect = crystalContainer.getBoundingClientRect();
            text.style.left = (x ? x : rect.left + rect.width / 2) + 'px';
            text.style.top = (y ? y : rect.top + rect.height / 2) + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function updateUI() {
            document.getElementById('crystalCount').innerText = Math.floor(crystals) + " Crystals";
            document.getElementById('cpsCount').innerText = "per second: " + getCps().toFixed(1);
            Object.keys(upgrades).forEach(key => {
                document.getElementById(key + 'Cost').innerText = "Cost: " + upgrades[key].cost;
                document.getElementById(key + 'Qty').innerText = upgrades[key].qty;
                const btn = document.getElementById('buy' + key.charAt(0).toUpperCase() + key.slice(1));
                if (btn) btn.disabled = crystals < upgrades[key].cost;
            });
        }

        setInterval(() => {
            crystals += getCps() / 10;
            updateUI();
        }, 100);

        setInterval(() => {
            const rawData = { crystals: crystals, upgrades: upgrades };
            const dataString = JSON.stringify(rawData);
            const secureEnvelope = {
                data: rawData,
                signature: generateSignature(dataString)
            };
            localStorage.setItem('crystalClickerSave', JSON.stringify(secureEnvelope));
        }, 10000);

        updateUI();
    </script>
</body>
</html>
