<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crystal Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stats-panel">
        <h1 id="crystalCount">0 Crystals</h1>
        <div class="cps" id="cpsCount">per second: 0</div>
    </div>
    <div class="crystal-container" id="crystalContainer">
        <div class="crystal" id="crystalBtn"></div>
    </div>
    <div class="shop-panel">
        <div class="shop-item">
            <div class="item-info">
                <div>Tier I Pickaxe</div>
                <div id="pickaxe1Cost">Cost: 15</div>
            </div>
            <button id="buyPickaxe1" onclick="buyUpgrade('pickaxe1')">Buy (<span id="pickaxe1Qty">0</span>)</button>
        </div>
        <div class="shop-item">
            <div class="item-info">
                <div>Tier II Pickaxe</div>
                <div id="pickaxe2Cost">Cost: 100</div>
            </div>
            <button id="buyPickaxe2" onclick="buyUpgrade('pickaxe2')">Buy (<span id="pickaxe2Qty">0</span>)</button>
        </div>
        <div class="shop-item">
            <div class="item-info">
                <div>Tier III Pickaxe</div>
                <div id="pickaxe3Cost">Cost: 1100</div>
            </div>
            <button id="buyPickaxe3" onclick="buyUpgrade('pickaxe3')">Buy (<span id="pickaxe3Qty">0</span>)</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
